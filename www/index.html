<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>字卡传讯</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="ink">

  <!-- ===== 主页（首页，参照情侣主页排版） ===== -->
  <div id="view-home" class="view active">
    <div class="home-scroll" id="home-scroll"></div>
  </div>

  <!-- ===== 朋友圈（占位，等参考图） ===== -->
  <div id="view-moments" class="view">
    <header class="wx-header">
      <div style="width:38px"></div>
      <div class="wx-title">朋友圈</div>
      <div style="width:38px"></div>
    </header>
    <div class="empty-state" style="flex:1">
      <div class="es-icon">🎞️</div>
      <div class="es-title">朋友圈 · 敬请期待</div>
      <div class="es-desc">等你的参考图和指令</div>
    </div>
  </div>

  <!-- ===== 消息列表（仿微信会话列表） ===== -->
  <div id="view-contacts" class="view">
    <header class="wx-header">
      <button class="wx-back" id="btn-contacts-back">‹</button>
      <div class="wx-title">消息</div>
      <button class="wx-btn" id="btn-add-contact" title="新建梦角 / 发起群聊">＋</button>
    </header>
    <div class="wx-search"><input type="text" id="contact-search" placeholder="搜索"></div>
    <main class="contact-list" id="contact-list"></main>
  </div>

  <!-- ===== 聊天页（仿微信对话） ===== -->
  <div id="view-chat" class="view">
    <header class="wx-header">
      <button class="wx-back" id="btn-chat-back">‹</button>
      <div class="chat-head-info">
        <div class="chat-head-name" id="chat-head-name">对方</div>
        <div class="chat-head-status" id="chat-head-status"></div>
      </div>
      <button class="wx-btn" id="btn-chat-info" title="聊天设置">⋯</button>
    </header>

    <main class="chat-stream" id="chat-stream"></main>

    <footer class="input-area-wrapper">
      <div class="reply-preview" id="reply-preview" style="display:none"></div>

      <div class="batch-preview" id="batch-preview" style="display:none"></div>

      <div class="more-panel" id="more-panel" style="display:none">
        <div class="more-grid">
          <button class="more-item" data-more="image"><span class="more-ico">🖼️</span><span>发送图片</span></button>
          <button class="more-item" data-more="poke"><span class="more-ico">👋</span><span>拍一拍</span></button>
          <button class="more-item" data-more="continue"><span class="more-ico">⏭️</span><span>让对方继续说</span></button>
          <button class="more-item" data-more="batch"><span class="more-ico">📚</span><span>批量发送</span></button>
          <button class="more-item" data-more="cards"><span class="more-ico">🗂️</span><span>字卡库</span></button>
        </div>
      </div>

      <div class="sticker-pop" id="sticker-pop" style="display:none">
        <div class="pop-tabs">
          <button class="pop-tab active" data-tab="emoji">表情</button>
          <button class="pop-tab" data-tab="poke">拍一拍</button>
        </div>
        <div class="pop-body" id="pop-body"></div>
      </div>

      <div class="input-area">
        <button class="ibtn" id="more-btn" title="更多">＋</button>
        <button class="ibtn" id="call-btn" title="语音通话">📹</button>
        <button class="ibtn" id="image-btn" title="发送图片">🖼️</button>
        <button class="ibtn" id="combo-btn" title="表情与拍一拍">😊</button>

        <textarea id="message-input" rows="1" placeholder=""></textarea>

        <div class="voice-wrap" id="voice-wrap" style="display:none">
          <button type="button" id="voice-btn">按住 说话</button>
          <div class="voice-hint" id="voice-hint">松开 发送，上滑 取消</div>
        </div>

        <button class="ibtn" id="mic-btn" title="语音消息">🎤</button>
        <button class="ibtn" id="continue-btn" title="让对方继续说">⏭️</button>
        <button class="ibtn" id="batch-btn" title="批量发送">📚</button>
        <button class="ibtn ibtn-send" id="send-btn" title="发送">➤</button>
      </div>
      <input type="file" id="image-input" accept="image/*" style="display:none">
    </footer>
  </div>

  <!-- ===== 设置页 ===== -->
  <div id="view-settings" class="view">
    <header class="wx-header">
      <button class="wx-back" id="btn-settings-back">‹</button>
      <div class="wx-title" id="settings-title">设置</div>
      <div style="width:38px"></div>
    </header>
    <main class="settings-body" id="settings-body"></main>
  </div>

  <!-- ===== 信件（占位，等参考图） ===== -->
  <div id="view-letters" class="view">
    <header class="wx-header">
      <div style="width:38px"></div>
      <div class="wx-title">信件</div>
      <div style="width:38px"></div>
    </header>
    <div class="empty-state" style="flex:1">
      <div class="es-icon">✉️</div>
      <div class="es-title">信件 · 敬请期待</div>
      <div class="es-desc">等你的参考图和指令</div>
    </div>
  </div>

  <!-- ===== 底部导航（四格：聊天/朋友圈/信件/设置，悬浮于主页下方） ===== -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item" data-nav="chat">
      <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 3v-3H6a2 2 0 0 1-2-2z"/></svg>
      <span>聊天</span>
      <span class="nav-badge" id="nav-badge-chat" style="display:none">0</span>
    </button>
    <button class="nav-item" data-nav="moments">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg>
      <span>朋友圈</span>
    </button>
    <button class="nav-item" data-nav="letters">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <span>信件</span>
    </button>
    <button class="nav-item" data-nav="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <!-- 弹层 -->
  <div class="sheet-mask" id="sheet-mask" style="display:none"></div>
  <div class="action-sheet" id="action-sheet" style="display:none"></div>
  <div id="modal-root"></div>
  <div class="img-viewer" id="img-viewer" style="display:none"><img id="img-viewer-img" alt=""></div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/features/weather.js"></script>
  <script src="js/features/player.js"></script>
  <script src="js/features/sound.js"></script>
  <script src="js/features/home.js"></script>
  <script src="js/features/contacts.js"></script>
  <script src="js/features/inputbar.js"></script>
  <script src="js/features/cards.js"></script>
  <script src="js/features/share.js"></script>
  <script src="js/features/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
